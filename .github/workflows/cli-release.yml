name: CLI release
on:
  push:
    branches: [master, main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Qt とビルドツールをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt6-base-dev qt6-multimedia-dev libgl-dev
      - name: サーバーとテストをビルド
        run: |
          mkdir -p build-server build-tests
          cd build-server
          qmake6 ../src/AsahikawaProcon-Server.pro CONFIG+=release
          make -j"$(nproc)"
          cd ../build-tests
          qmake6 ../tests/cli.pro
          make -j"$(nproc)"
      - name: CLI テスト
        run: CHASER_SERVER_BINARY="$GITHUB_WORKSPACE/build-server/AsahikawaProcon-Server" ./build-tests/cli_test
      - name: 実行ファイルをパッケージ
        run: |
          mkdir -p cli-linux-x86_64
          cp build-server/AsahikawaProcon-Server cli-linux-x86_64/
          tar -czf cli-linux-x86_64.tar.gz cli-linux-x86_64
          sha256sum cli-linux-x86_64.tar.gz > cli-linux-x86_64.tar.gz.sha256
      - name: コミットごとのリリースを作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cli-${GITHUB_SHA}"
          gh release create "$tag" cli-linux-x86_64.tar.gz cli-linux-x86_64.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "CLI ${GITHUB_SHA}" \
            --notes "Ubuntu 24.04 x86_64 向け CLI ビルドです。実行には Qt 6 のランタイムが必要です。" \
            --prerelease --latest=false
